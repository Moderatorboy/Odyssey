<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Odyssey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #070b0d;
        --void-raised: #0d1519;
        --void-line: #182428;
        --cyan: #3ecbdb;
        --cyan-bright: #8be9f2;
        --cyan-dim: #1f4d54;
        --white: #eef7f8;
        --paper: #dfeef0;
        --powder: #a9c9d6;
        --slate: #5c7a99;
        --fog: #86a0a6;
        --fog-dim: #4c6167;
        --font-serif: "Source Serif 4", serif;
        --font-sans: "Inter", sans-serif;
        --font-mono: "IBM Plex Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--void);
        color: var(--paper);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      a:focus-visible,
      button:focus-visible,
      input:focus-visible {
        outline: 1.5px solid var(--cyan);
        outline-offset: 3px;
      }

      .frame {
        max-width: 1040px;
        margin: 0 auto;
        padding: 0 1.75rem;
      }

      .masthead {
        border-bottom: 1px solid var(--void-line);
        padding: 1.6rem 0 1.4rem;
      }
      .masthead-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.4rem 1.2rem;
      }
      .wordmark {
        font-family: var(--font-serif);
        font-weight: 600;
        font-size: 1.3rem;
        color: var(--white);
      }
      .masthead-right {
        display: flex;
        align-items: baseline;
        gap: 1.6rem;
      }
      .portal-tag {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--fog);
      }
      .nav-link {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        color: var(--cyan);
        text-decoration: none;
        border-bottom: 1px solid transparent;
      }
      .nav-link:hover {
        border-bottom-color: var(--cyan);
        color: var(--cyan-bright);
      }

      main {
        min-height: calc(100vh - 68px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3.5rem 1.75rem;
      }

      .panel {
        width: 100%;
        max-width: 460px;
        border: 1px solid var(--void-line);
        border-radius: 3px;
        padding: 2.4rem 2.2rem 2.2rem;
        background: var(--void-raised);
      }
      .panel .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--cyan);
      }
      .panel h1 {
        font-family: var(--font-serif);
        font-weight: 500;
        font-size: 1.5rem;
        margin: 0.6rem 0 0.5rem;
        color: var(--white);
      }
      .panel p.desc {
        color: var(--fog);
        font-size: 0.88rem;
        line-height: 1.55;
        margin: 0 0 1.9rem;
      }

      .dropzone {
        border: 1.5px dashed var(--void-line);
        border-radius: 3px;
        padding: 2.2rem 1rem;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
        margin-bottom: 1rem;
      }
      .dropzone.drag {
        border-color: var(--cyan);
        background: rgba(62, 203, 219, 0.05);
      }
      .dropzone .icon {
        font-size: 1.5rem;
        display: block;
        margin-bottom: 0.5rem;
        color: var(--cyan);
      }
      .dropzone .main-text {
        font-size: 0.9rem;
        color: var(--paper);
      }
      .dropzone .sub-text {
        font-size: 0.76rem;
        color: var(--fog-dim);
        margin-top: 0.4rem;
        font-family: var(--font-mono);
      }
      .dropzone input[type="file"] {
        display: none;
      }

      .file-chip {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        border: 1px solid var(--void-line);
        border-radius: 2px;
        padding: 0.6rem 0.8rem;
        margin-bottom: 1.4rem;
        font-family: var(--font-mono);
        font-size: 0.76rem;
      }
      .file-chip.show {
        display: flex;
      }
      .file-chip .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--paper);
      }
      .file-chip button {
        border: none;
        background: none;
        color: var(--powder);
        cursor: pointer;
        font-size: 0.8rem;
        font-family: var(--font-sans);
      }
      .file-chip button:hover {
        color: var(--cyan-bright);
      }

      .upload-btn {
        width: 100%;
        padding: 0.85rem 1rem;
        background: var(--cyan);
        color: var(--void);
        border: none;
        border-radius: 2px;
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 0.9rem;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .upload-btn:hover {
        background: var(--cyan-bright);
      }
      .upload-btn:disabled {
        background: var(--void-line);
        color: var(--fog-dim);
        cursor: not-allowed;
      }

      .status-line {
        margin-top: 1rem;
        font-family: var(--font-mono);
        font-size: 0.76rem;
        display: none;
        padding: 0.6rem 0.7rem;
        border-radius: 2px;
        line-height: 1.4;
      }
      .status-line.show {
        display: block;
      }
      .status-line.pending {
        background: rgba(134, 160, 166, 0.1);
        color: var(--fog);
      }
      .status-line.ok {
        background: rgba(62, 203, 219, 0.1);
        color: var(--cyan-bright);
      }
      .status-line.fail {
        background: rgba(194, 92, 75, 0.12);
        color: #d98a7a;
      }
    </style>
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-row frame">
        <span class="wordmark">Odyssey</span>
        <div class="masthead-right">
          <span class="portal-tag">Polar Research Outreach Portal</span>
          <a class="nav-link" href="viewer.html">Archive</a>
        </div>
      </div>
    </header>

    <main>
      <div class="panel">
        <span class="eyebrow">Restricted access</span>
        <h1>Upload a record</h1>
        <p class="desc">
          Select a file from the field archive and send it to the repository.
        </p>

        <div class="dropzone" id="dropzone">
          <span class="icon">⤒</span>
          <div class="main-text">Drag a file here, or click to browse</div>
          <div class="sub-text">No file selected</div>
          <input type="file" id="fileInput" />
        </div>

        <div class="file-chip" id="fileChip">
          <span class="name" id="fileName"></span>
          <button type="button" id="clearFile">Remove</button>
        </div>

        <button class="upload-btn" id="uploadBtn" onclick="uploadFile()">
          Upload
        </button>

        <div class="status-line" id="statusLine"></div>
      </div>
    </main>

    <script>
      const dropzone = document.getElementById("dropzone");
      const fileInput = document.getElementById("fileInput");
      const subText = dropzone.querySelector(".sub-text");
      const fileChip = document.getElementById("fileChip");
      const fileNameEl = document.getElementById("fileName");
      const clearFileBtn = document.getElementById("clearFile");
      const uploadBtn = document.getElementById("uploadBtn");
      const statusLine = document.getElementById("statusLine");

      dropzone.addEventListener("click", () => fileInput.click());
      dropzone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropzone.classList.add("drag");
      });
      dropzone.addEventListener("dragleave", () =>
        dropzone.classList.remove("drag"),
      );
      dropzone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropzone.classList.remove("drag");
        if (e.dataTransfer.files.length) {
          fileInput.files = e.dataTransfer.files;
          showFile(e.dataTransfer.files[0]);
        }
      });
      fileInput.addEventListener("change", () => {
        if (fileInput.files.length) showFile(fileInput.files[0]);
      });
      clearFileBtn.addEventListener("click", () => {
        fileInput.value = "";
        fileChip.classList.remove("show");
        subText.textContent = "No file selected";
      });

      function showFile(file) {
        fileNameEl.textContent = file.name;
        fileChip.classList.add("show");
        subText.textContent = "Ready to upload";
      }

      function setStatus(kind, text) {
        statusLine.className = "status-line show " + kind;
        statusLine.textContent = text;
      }

      async function uploadFile() {
        const input = document.getElementById("fileInput");
        const file = input.files[0];
        if (!file) {
          setStatus("fail", "Please select a file.");
          return;
        }

        setStatus("pending", "Processing, please wait…");
        uploadBtn.disabled = true;

        const formData = new FormData();
        formData.append("file", file);
        try {
          const response = await fetch(
            "https://odyssey-org.onrender.com/upload",
            {
              method: "POST",
              body: formData,
            },
          );
          const data = await response.json();
          setStatus("ok", "Upload complete — " + JSON.stringify(data));
        } catch (error) {
          setStatus("fail", "Upload failed: " + error);
        } finally {
          uploadBtn.disabled = false;
        }
      }
    </script>
  </body>
</html>
